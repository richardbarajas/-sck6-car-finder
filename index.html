<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Where TF did I park?</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Where TF did I <span>park</span>?</h1>
    <p class="subtitle">SCK6 Parking Companion</p>
    <div class="header-buttons">
      <button class="btn" id="view-toggle">📱 Portrait View</button>
      <button class="btn accent" id="gps-btn">📍 Drop GPS Pin</button>
      <button class="btn" id="zoom-in">🔍+</button>
      <button class="btn" id="zoom-out">🔍−</button>
    </div>
  </header>

  <div class="gps-banner" id="gps-banner" style="display:none;">
    <span class="pin">🛰️</span>
    <div class="gps-info">
      <strong id="gps-loc"></strong>
      <span id="gps-time"></span>
    </div>
    <button class="btn nav" id="nav-btn">🧭 Navigate</button>
    <button class="btn danger" id="gps-clear-btn">Clear</button>
  </div>

  <div class="saved-banner" id="saved-banner" style="display:none;">
    <span class="pin">📍</span>
    <div class="saved-info">
      <strong id="saved-loc"></strong>
      <span id="saved-time"></span>
    </div>
    <button class="btn" id="find-btn">Find</button>
    <button class="btn danger" id="clear-btn">Clear</button>
  </div>

  <div class="lot-scroll">
    <div class="lot" id="lot">
      <!-- Parking area + Grant Line Road on the right -->
      <div class="lot-with-road">
        <div class="parking-lot" id="parking-lot"></div>

        <div class="road road-right">
          <div class="road-arrows">↑<br>↑<br>↑</div>
          <span class="road-name">Grant Line Rd</span>
          <div class="road-arrows">↓<br>↓<br>↓</div>
        </div>
      </div>
    </div>
